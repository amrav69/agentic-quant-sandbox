services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  tui:
    build:
      context: .
      dockerfile: Dockerfile
    command: python tui.py
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
