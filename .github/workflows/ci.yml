name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-ci:
    name: Rust — fmt + clippy + test + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: .

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: .

      - name: Build
        run: cargo build --workspace
        working-directory: .

      - name: Test
        run: cargo test --workspace
        working-directory: .

      - name: Audit
        run: cargo audit
        continue-on-error: true

  rust-coverage:
    name: Rust — cargo-tarpaulin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate coverage
        run: cargo tarpaulin --workspace --out Lcov --output-dir coverage

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: coverage/lcov.info

  python-ci:
    name: Python — lint + test + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check --output-format=github .
        continue-on-error: true

      - name: Test with pytest + coverage
        run: pytest --tb=short -q --cov=backend --cov-report=term-missing --cov-report=xml
        timeout-minutes: 20

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report-${{ matrix.python-version }}
          path: coverage.xml
