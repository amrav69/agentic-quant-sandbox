[package]
name = "quant-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ta = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lib]
name = "quant_core"
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies.pyo3]
version = "0.21"
optional = true
features = ["extension-module"]

[[test]]
name = "indicators_test"
path = "tests/indicators_test.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "indicators_bench"
harness = false
